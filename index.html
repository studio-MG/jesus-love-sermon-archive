<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Jesus' Love Church - THE WAY 237</title>
  <link rel="stylesheet" href="./styles.css?v=share-refresh-1">
</head>
<body>
  <main class="site-shell">
    <div class="ambient-architecture" aria-hidden="true">
      <span class="ambient-plane ambient-plane-left"></span><span class="ambient-plane ambient-plane-right"></span><span class="ambient-plane ambient-plane-base"></span>
      <span class="ambient-shelf"></span><span class="ambient-niche"><i></i><i></i><i></i></span>
      <span class="ambient-orb ambient-orb-top"></span><span class="ambient-orb ambient-orb-middle"></span><span class="ambient-orb ambient-orb-low"></span>
    </div>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Jesus' Love Church - THE WAY 237 홈"><img class="brand-logo" src="./jxlogo.svg" alt="Jesus' Love Church"><span class="brand-dash">—</span><span>THE WAY 237</span></a>
    </header>
    <section class="archive" aria-labelledby="archive-title">
      <div class="section-head"><div><span class="section-kicker">Sermon Archive</span><h1 id="archive-title">말씀 아카이브</h1></div><input id="search" class="search" type="search" placeholder="제목·성경 본문·내용·날짜 검색" aria-label="말씀 검색"></div>
      <div id="tabs" class="tabs" role="tablist" aria-label="예배 분류"></div>
      <fieldset id="detail-filters" class="detail-filters is-hidden"><legend id="detail-filter-title"></legend><div id="detail-filter-options"></div></fieldset>
      <div id="month-pagination" class="month-pagination" aria-label="월별 말씀 페이지"></div>
      <div id="cards" class="cards month-page month-page-next" aria-live="polite"></div>
    </section>
    <div id="modal-backdrop" class="modal-backdrop is-hidden" role="presentation">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="sermon-title">
        <div class="modal-head"><div class="modal-head-top"><span class="badge">전체 녹취록</span><div class="modal-actions"><button id="share-sermon" class="quiet-btn share-btn" type="button" aria-label="이 말씀 공유하기">공유</button><a id="print-link" class="quiet-btn" target="_blank">PDF · 인쇄</a><button id="close-modal" class="quiet-btn" type="button">닫기</button></div></div><p id="share-notice" class="share-notice" role="status"></p><div class="transcript-search-bar" role="search"><input id="transcript-search" type="search" placeholder="녹취록 본문에서 검색" aria-label="녹취록 본문에서 검색"><span id="transcript-search-count" class="transcript-search-count" aria-live="polite"></span><button id="transcript-search-prev" type="button" aria-label="이전 검색 결과">↑</button><button id="transcript-search-next" type="button" aria-label="다음 검색 결과">↓</button></div></div>
        <div class="modal-body"><div class="modal-meta-row"><div id="modal-meta" class="modal-meta"></div><div class="font-size-controls" aria-label="본문 글자 크기 조절"><button id="font-smaller" type="button" aria-label="본문 글자 작게">−</button><output id="font-size-value" aria-live="polite">16px</output><button id="font-larger" type="button" aria-label="본문 글자 크게">＋</button></div></div><h2 id="sermon-title"></h2><p id="modal-passage" class="modal-passage"></p>
          <div class="annotation-panel"><div class="annotation-toolbar" role="toolbar" aria-label="녹취록 표시 도구">
            <button class="annotation-btn annotation-highlight" data-command="hiliteColor" aria-label="형광펜"><span class="annotation-icon">🖍</span><span class="annotation-label">형광펜</span><span class="annotation-mobile-label">형광</span></button>
            <button class="annotation-btn annotation-bold" data-command="bold" aria-label="굵게"><span class="annotation-icon">B</span><span class="annotation-label">굵게</span><span class="annotation-mobile-label">굵게</span></button>
            <button class="annotation-btn annotation-underline" data-command="underline" aria-label="밑줄"><span class="annotation-icon">U</span><span class="annotation-label">밑줄</span><span class="annotation-mobile-label">밑줄</span></button>
            <button class="annotation-btn" data-command="removeFormat" aria-label="선택 효과 지우기"><span class="annotation-icon">⌫</span><span class="annotation-label">선택 효과 지우기</span><span class="annotation-mobile-label">지우기</span></button>
            <button id="clear-effects" class="annotation-btn annotation-clear" aria-label="전체 효과 지우기"><span class="annotation-icon">↺</span><span class="annotation-label">전체 효과 지우기</span><span class="annotation-mobile-label">전체삭제</span></button>
          </div><p id="annotation-guide" class="annotation-guide" aria-live="polite">문장을 드래그해 선택한 뒤 원하는 효과를 누르세요.<span> 표시는 이 기기에만 저장되며 PDF에는 나오지 않습니다.</span></p></div>
          <div id="transcript" class="transcript annotated-transcript" contenteditable="true" role="document" aria-label="개인 표시가 가능한 전체 녹취록"></div>
        </div>
      </section>
    </div>
  </main>
  <script src="./app.js?v=share-refresh-1" defer></script>
</body></html>
