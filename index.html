<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Jesus' Love Church · THE WAY 237</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="site-header">
    <a class="brand" href="./"><img src="./jxlogo.svg" alt="Jesus' Love Church"><span>Jesus' Love Church</span></a>
    <div class="brand-sub">THE WAY 237</div>
  </header>
  <main>
    <nav id="categories" class="categories" aria-label="말씀 카테고리"></nav>
    <section class="controls">
      <label class="search"><span>검색</span><input id="search" type="search" placeholder="제목·본문·날짜·내용 검색 (예: 8월 2일)" autocomplete="off"></label>
      <div class="month-nav"><button id="older" type="button">‹ 이전</button><strong id="month"></strong><button id="newer" type="button">다음 ›</button></div>
    </section>
    <p id="status" class="status" aria-live="polite"></p>
    <section id="cards" class="cards"></section>
  </main>
  <dialog id="reader" class="reader">
    <article>
      <header class="reader-head">
        <button id="reader-back" type="button" class="soft">전체 녹취록</button>
        <div class="reader-actions"><a id="print" class="soft" target="_blank">PDF · 인쇄</a><button id="close" class="soft" type="button">닫기</button></div>
      </header>
      <div class="reader-title"><p id="reader-meta"></p><h1 id="reader-heading"></h1><p id="reader-passage"></p></div>
      <div id="transcript" class="transcript" contenteditable="true" spellcheck="false"></div>
      <aside class="effects" aria-label="읽기 효과 도구">
        <button data-command="backColor" data-value="#fff08a" title="형광펜"><span>🖍️</span><b>형광펜</b></button>
        <button data-command="bold" title="굵게"><span>B</span><b>굵게</b></button>
        <button data-command="underline" title="밑줄"><span>U̲</span><b>밑줄</b></button>
        <button id="remove-format" title="선택 효과 지우기"><span>⌫</span><b>선택 지우기</b></button>
        <button id="clear-effects" title="전체 효과 지우기"><span>↶</span><b>전체 지우기</b></button>
      </aside>
    </article>
  </dialog>
  <script src="./app.js" defer></script>
</body>
</html>
